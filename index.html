<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="profile">
        <img
          src="images/profile-photo.jpg"
          alt="Profile Photo"
          class="profile-img"
        />

        <h1>
          Alex G.
          <img src="images/verified.svg" alt="Verified" class="verified-icon" />
        </h1>

        <p>Full-stack developer.</p>
      </header>

      <main class="links-wrapper">
        <a href="#" class="link-card">
          <div class="link-content">
            <span class="link-icon">🚀</span>
            <span>Check Out My Latest Project</span>
          </div>
          <span class="arrow-icon">→</span>
        </a>

        <a href="#" class="link-card">
          <div class="link-content">
            <span class="link-icon">✍️</span>
            <span>Read My Tech Blog</span>
          </div>
          <span class="arrow-icon">→</span>
        </a>

        <a href="#" class="link-card">
          <div class="link-content">
            <span class="link-icon">🎥</span>
            <span>Subscribe To My YouTube</span>
          </div>
          <span class="arrow-icon">→</span>
        </a>

        <a href="#" class="link-card">
          <div class="link-content">
            <span class="link-icon">🛠️</span>
            <span>Free Web Dev Resources</span>
          </div>
          <span class="arrow-icon">→</span>
        </a>

        <a href="#" class="link-card">
          <div class="link-content">
            <span class="link-icon">☕</span>
            <span>Buy Me A Coffee</span>
          </div>
          <span class="arrow-icon">→</span>
        </a>
      </main>

      <footer class="socials">
        <a href="#" class="social-icon">
          <img src="images/x.svg" alt="X" class="icon-svg" />
        </a>

        <a href="#" class="social-icon">
          <img src="images/github.svg" alt="GitHub" class="icon-svg" />
        </a>

        <a href="#" class="social-icon">
          <img src="images/instagram.svg" alt="Instagram" class="icon-svg" />
        </a>
      </footer>
    </div>
  </body>
</html>
